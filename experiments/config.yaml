# Every tunable parameter and modelling assumption lives here.
# Values marked ASSUMPTION are not in the RTA data; see docs/assumptions.md.

seed: 42

data:
  raw_dir: data
  processed_dir: data/processed
  ridership_baseline_year: 2025        # 2025 rows are ~daily snapshots; median per station = typical day

network:
  metro_speed_kmh: 37.0                # ASSUMPTION: average incl. dwell (brief default)
  entry_exit_min: 2.0                  # ASSUMPTION: street <-> platform; a transfer = exit + entry = 4 min
  walk_speed_kmh: 5.0                  # ASSUMPTION
  walk_detour: 1.3                     # ASSUMPTION: street distance / straight-line distance
  walk_max_km: 1.5                     # walk edges only between stations closer than this
  bus_speed_kmh: 25.0                  # ASSUMPTION: shuttle speed in storm traffic
  road_detour: 1.4                     # ASSUMPTION: road distance / straight-line distance
  bus_stop_dwell_min: 1.0
  track_snap_m: 300                    # station must be this close to KML geometry to use track chainage

time:
  start_hour: 5.0
  end_hour: 24.0
  step_min: 15
  # ASSUMPTION: share of a station's daily trips per hour (two RTA peaks 7:00-9:30, 17:00-20:30)
  hourly_profile: {5: 0.010, 6: 0.035, 7: 0.085, 8: 0.095, 9: 0.065, 10: 0.045, 11: 0.042,
                   12: 0.045, 13: 0.047, 14: 0.048, 15: 0.052, 16: 0.060, 17: 0.080, 18: 0.088,
                   19: 0.075, 20: 0.055, 21: 0.040, 22: 0.032, 23: 0.025}

capacity:
  train_capacity: 643                  # RTA capacity file: 643 passengers per 5-car Metro train
  # ASSUMPTION: station capacity proxy = factor x busiest 15-min baseline demand
  station_capacity_factor: 1.3

flood:
  background_share: 0.25               # share of storm intensity falling everywhere (2024 storm was widespread)
  rain_noise_sd: 0.15                  # lognormal per-station noise
  susceptibility_floor: 0.35           # s_i = floor + (1-floor) * vulnerability_i
  # calibrated by src/core/flood.py::calibrate on the April 2024 replay (do not hand-edit)
  threshold_mm: 45.0
  base_drainage_mmh: 3.0

closures_2024: [Noor Bank, First Abu Dhabi Bank, Mashreq, Energy]   # = Onpassive, Equiti, Mashreq, Energy

presets:
  # Replay: exactly the four real 2024 closures; the storm model only decides WHEN each closes
  # (first step its water passes the threshold, or its peak water level if it never does).
  april_2024_replay: {total_mm: 145, peak_mmh: 45, duration_h: 12, start_hour: 6.0,
                      path: [[55.03, 24.95], [55.45, 25.32]], radius_km: 14, drainage: 1.0,
                      force_closed: [Noor Bank, First Abu Dhabi Bank, Mashreq, Energy], force_mode: flood_timed}
  moderate_storm:    {total_mm: 60,  peak_mmh: 20, duration_h: 6,  start_hour: 7.0,
                      path: [[55.10, 25.00], [55.40, 25.30]], radius_km: 10, drainage: 1.0}
  extreme_storm:     {total_mm: 220, peak_mmh: 70, duration_h: 14, start_hour: 6.0,
                      path: [[55.05, 25.00], [55.42, 25.30]], radius_km: 18, drainage: 1.0}
  interchange_failure: {total_mm: 90, peak_mmh: 40, duration_h: 6, start_hour: 7.0,
                      path: [[55.27, 25.22], [55.34, 25.29]], radius_km: 6, drainage: 1.0,
                      force_closed: [BurJuman], force_hour: 8.0}      # interchange taken out at 08:00
  random_closures:   {total_mm: 60, peak_mmh: 20, duration_h: 6, start_hour: 7.0,
                      path: [[55.10, 25.00], [55.40, 25.30]], radius_km: 10, drainage: 1.0,
                      random_closures: 4, force_hour: 8.0}            # 4 random stations close from 08:00

crowd:
  displaced_dests_per_station: 40      # sampled OD trips per displaced station
  unserved_max_min: 150                # trips longer than this count as unserved
  crowd_penalty_min: 15.0              # crowd-aware A*: expected queue wait = 15 min x (load ratio - 1)
  crowd_penalty_from: 1.0
  abandon_per_step: 0.3                # ASSUMPTION: share of queued passengers who give up each 15 min
  increments: 5                        # incremental assignment rounds (crowd-aware routing)

policy:
  relief_radius_min: 10                # a displaced passenger is "covered" if a relief point is within T minutes
  bus_fleet: 30                        # ASSUMPTION: same shuttle fleet for both policies
  staff_teams: 6                       # ASSUMPTION: staff teams dispatched each step (both policies)
  terminal_reach: 3                    # AI bridge terminals searched up to this many stops beyond a break
  baseline_stops_at_closed: true       # fairer baseline: the 2024-style shuttle also stops at closed stations

ga:
  k: 5
  population: 100                      # tuned: see scripts/tune_ga.py and results/ga_tuning.csv
  generations: 150
  tournament_size: 3
  crossover_rate: 0.9
  mutation_rate: 0.2
  elitism: 2
  selection: tournament                # or roulette (ablation)
  w_priority: 0.5                      # weight of fuzzy-priority coverage
  w_overload: 0.3                      # penalty weight for hubs at overloaded stations
  w_time: 0.5                          # weight of mean hours to nearest hub
