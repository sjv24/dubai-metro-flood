<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Metro Flood Response AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <link href="/static/style.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/deck.gl@9.0.38/dist.min.js"></script>
</head>
<body>
  <header id="top">
    <div class="brand"><span class="dot"></span><div><b>Metro Flood Response AI</b><small>Dubai Metro · CSCI218 · UOWD</small></div></div>
    <nav id="tabs">
      <button data-tab="data"><i>1</i>Data</button>
      <button data-tab="flood"><i>2</i>Flood model</button>
      <button data-tab="fuzzy"><i>3</i>Fuzzy priority</button>
      <button data-tab="search"><i>4</i>A* search</button>
      <button data-tab="bridge"><i>5</i>Bus design (A*)</button>
      <button data-tab="ga"><i>6</i>Genetic algorithm</button>
      <button data-tab="results"><i>7</i>Results</button>
    </nav>
    <div class="run">
      <select id="scenario" aria-label="Scenario">
        <option value="april_2024_replay">April 16, 2024 replay</option>
        <option value="moderate_storm">Moderate storm</option>
        <option value="extreme_storm">Extreme storm</option>
        <option value="interchange_failure">Interchange failure (BurJuman)</option>
        <option value="random_closures">Random closures</option>
      </select>
      <input id="seed" type="number" value="42" min="0" max="9999" aria-label="Seed" title="Random seed" />
      <button id="runBtn" class="primary">Run</button>
    </div>
  </header>

  <main>
    <section id="mapcol">
      <div id="map"></div>
      <div id="mapLegend" class="maplegend"></div>
      <div id="mapNote" class="mapnote"></div>
      <div id="timeline">
        <button id="playBtn" class="icon" aria-label="Play">▶</button>
        <input id="scrub" type="range" min="0" max="75" value="0" aria-label="Time" />
        <span id="tlabel" class="mono">05:00</span>
      </div>
      <div id="status" class="status"></div>
    </section>
    <section id="explain"></section>
  </main>

  <div id="tooltip"></div>
  <footer>Simulated scenario on real RTA open data · the baseline is a model of the 2024 response, not measured 2024 outcomes</footer>
  <script src="/static/charts.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
